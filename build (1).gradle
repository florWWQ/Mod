plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.minecraft_version}+build.8:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Minecraft 1.21.4 includes Netty 4.1.115.Final; these two modules provide
    // Netty's SOCKS5 handler, which Minecraft itself does not expose.
    include implementation("io.netty:netty-handler-proxy:4.1.115.Final")
    include implementation("io.netty:netty-codec-socks:4.1.115.Final")
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') { rename { "${it}_${project.archivesBaseName}" } }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) { from components.java }
    }
}
